<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mooneh Occupancy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm operations console for warehouse managers
   IDEA: the reel's admin dashboard, re-lit on white: one tab per warehouse
   PICTURE: daily in/out bars + a deep-blue live rail of the last day's operations
   COLOUR and TYPE: moonehtrade.com palette: white ground, navy #061a2c/#0a2e4b, cyan #00c7ed, gold #d8ad5c; Inter + IBM Plex Sans Arabic
   LAYOUT: sidebar of warehouses, header with upload, KPI strip, chart + rail, tables */
:root{color-scheme:dark;--bg:#12385d;--side:#174269;--ink:#ffffff;--mut:#9fb6c6;--line:rgba(255,255,255,.12);--card:#184572;--soft:#1e4f7f;--in:#00c7ed;--out:#6f9ab5;--ok:#22c55e;--warn:#d8ad5c;--bad:#ff3d7f}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,"IBM Plex Sans Arabic",system-ui,sans-serif;overflow-x:clip}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);gap:20px;padding:20px;max-width:1440px;margin:auto}
.side{position:sticky;top:20px;align-self:start;background:var(--side);border:1px solid var(--line);border-radius:20px;padding:18px 12px}
.brand{display:flex;gap:10px;align-items:center;margin:0 6px 20px}
.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#061a2c,#079fc4);display:grid;place-items:center;font-weight:700;color:#fff}
.brand b{display:block;font-size:15px}.brand small{color:var(--mut);font-size:12px}
.nav button{all:unset;box-sizing:border-box;display:flex;width:100%;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;color:#c5d7e2;font-size:14.5px;min-height:44px;cursor:pointer}
.nav button:hover{background:rgba(255,255,255,.06)}.nav button.on{background:#00c7ed;color:#061a2c;font-weight:700}
.nav button:focus-visible{outline:2px solid var(--in);outline-offset:2px}
.nav .tag{font-size:11px;padding:1px 8px;border-radius:99px;background:rgba(255,255,255,.1);color:#c5d7e2}
.nav button.on .tag{background:rgba(6,26,44,.18);color:#061a2c}
.nav .tag.bad{background:#fde8e8;color:var(--bad)}
.main{display:grid;gap:18px;align-content:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 1px 2px rgba(0,0,0,.2),0 12px 32px -20px rgba(0,0,0,.6)}
.top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
.meta{color:var(--mut);font-size:13px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-inline-end:6px}
h1{font-size:clamp(24px,3vw,34px);line-height:1.15;margin:8px 0 4px;font-weight:700;text-wrap:balance}
h1 em{font-style:normal;color:var(--bad)}
h2{font-size:18px;margin:0 0 4px}.sub{color:var(--mut);font-size:13px;margin:0 0 14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.kpi{background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:14px;transition:transform .2s,box-shadow .2s}
.kpi:hover{transform:translateY(-4px);box-shadow:0 12px 24px -16px rgba(0,199,237,.5)}
.kpi span{color:var(--mut);font-size:12.5px}.kpi b{display:block;font-size:clamp(22px,2.4vw,28px);font-weight:700;margin:2px 0;white-space:nowrap;direction:ltr;text-align:right;unicode-bidi:isolate}
.kpi small{font-size:12px;color:var(--mut)}.bad{color:var(--bad)}.warn{color:var(--warn)}.ok{color:var(--ok)}
.row{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:18px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12.5px;color:var(--mut);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.fig{position:relative;min-height:300px}.fig>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tip{position:absolute;pointer-events:none;background:#ffffff;color:#061a2c;border-radius:10px;padding:8px 10px;font-size:12.5px;opacity:0;transition:opacity .12s;white-space:nowrap;z-index:5}
.live{background:linear-gradient(160deg,#1f5a8a,#174a75);color:#fff;border:1px solid rgba(0,199,237,.35)}
.live .meta,.live .sub,.live small{color:rgba(255,255,255,.75)}
.live .dot{background:#00c7ed}
.live .big{font-size:30px;font-weight:700;margin-top:4px}
.op{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid rgba(255,255,255,.14)}
.op .ic{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:14px;font-weight:700;background:rgba(255,255,255,.16)}
.op b{font-size:13.5px;display:block}.op .q{margin-inline-start:auto;font-weight:700;white-space:nowrap}
.meter{margin:12px 0}.meter .h{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;margin-bottom:6px}.meter .h small{color:var(--mut)}
.bar{position:relative;height:12px;border-radius:99px;background:rgba(255,255,255,.1)}
.bar>i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:99px}
.bar .th{position:absolute;top:-4px;bottom:-4px;width:2px;background:#94a3b8}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{color:var(--mut);font-weight:500;text-align:start;padding:8px 6px;border-bottom:1px solid var(--line);font-size:12.5px}
td{padding:9px 6px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:left;direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.g td{color:var(--mut);font-size:12px;background:var(--soft)}
tr.t td{font-weight:700}
.scroll{overflow-x:auto}.scroll table{min-width:520px}
.up{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:inherit;font-size:14px;font-weight:600;color:#061a2c;background:#00c7ed;border:0;border-radius:12px;padding:10px 16px;min-height:44px;cursor:pointer}
.btn:hover{background:#079fc4;color:#fff}.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.st{font-size:12.5px;color:var(--mut)}.st.err{color:var(--bad)}.st.ok{color:var(--ok)}
.drop{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(18,56,93,.95);border:3px dashed var(--in);font-size:22px;font-weight:700;color:var(--in)}
.drop.on{display:grid}
.soon{text-align:center;padding:60px 20px;color:var(--mut)}.soon b{display:block;color:var(--ink);font-size:20px;margin-bottom:6px}
.rooms{display:flex;flex-wrap:wrap;gap:8px}
.rm{all:unset;box-sizing:border-box;border-radius:14px;padding:10px 8px;min-height:84px;min-width:64px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;border:2px solid transparent;transition:transform .15s}
.rm:hover{transform:translateY(-2px)}.rm:focus-visible,.rm.sel{border-color:#ffffff}
.rm b{font-size:15px}.rm small{font-size:11.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.det{margin-top:14px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13.5px;min-height:60px}
.det small{color:var(--mut)}
.whc{all:unset;box-sizing:border-box;cursor:pointer;display:block;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;transition:transform .15s,box-shadow .15s}
.whc:hover,.whc:focus-visible{transform:translateY(-3px);box-shadow:0 14px 28px -18px rgba(0,199,237,.6);outline:none}
.whc .pc{font-size:34px;font-weight:700;direction:ltr;text-align:right;line-height:1.2}
.whs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.badge{font-size:11.5px;padding:2px 10px;border-radius:99px;font-weight:600}.badge.bad{background:#fde8e8}.badge.low{background:#fde8e8;color:#c81e1e}.low{color:#ff5f63}.badge.warn{background:#f7ecd6}.badge.ok{background:#dcfce7}
.ro [data-up],.ro .uphint{display:none!important}
.archm [data-up],.archm .uphint{display:none!important}
.arch{position:fixed;bottom:16px;right:16px;z-index:40;display:flex;align-items:center;gap:8px;background:#0f2f4f;border:1px solid rgba(0,199,237,.45);border-radius:999px;padding:7px 8px 7px 14px;box-shadow:0 8px 24px rgba(0,0,0,.35);font-size:13px;color:#fff}
.arch[hidden],.archbar[hidden]{display:none}.arch select{background:#184572;color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 10px;font:inherit;cursor:pointer}
.archbar{margin:12px 0 0;padding:10px 14px;border-radius:12px;background:rgba(216,173,92,.16);border:1px solid rgba(216,173,92,.5);color:#f3d89c;font-size:14px}.archbar button{margin-inline-start:8px;background:#d8ad5c;color:#2b1d00;border:0;border-radius:999px;padding:4px 12px;font:inherit;font-weight:600;cursor:pointer}
.fp{display:grid;direction:ltr;gap:4px;min-width:600px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:8px}
.fp .rm{direction:rtl;min-width:0;min-height:0;padding:5px 6px;border-radius:8px;justify-content:flex-start;gap:1px;text-align:center;align-items:center}
.fp .rm b{font-size:16px}.fp .rm small{font-size:12.5px;max-width:100%}.stack{display:grid;gap:18px}.optab{margin-top:6px}.optab td,.optab th{padding:8px 6px}.tg{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}.tg.i{background:rgba(0,199,237,.16);color:var(--in)}.tg.o{background:rgba(216,173,92,.18);color:#e7c27d}.dtab td,.dtab th{padding-top:9px;padding-bottom:9px}.dtab tbody tr:nth-child(even):not(.t){background:rgba(255,255,255,.03)}.opg{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));column-gap:24px}.fp{gap:6px!important}.fp .rm{padding:8px 8px!important}.fp .rm .pc2{font-weight:700;font-size:12px;margin-top:auto;white-space:nowrap}
.corr{background:rgba(255,255,255,.08);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#9fb6c6;font-size:13px}
.load{background:rgba(255,255,255,.08);border-radius:6px;display:flex;align-items:center;justify-content:center}.load span{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:700;letter-spacing:2px;color:#62788a;font-size:13px}
.docks{display:flex;flex-direction:column;justify-content:space-around;gap:4px;padding:0 2px}.dock{border:1px solid rgba(255,255,255,.2);background:transparent;border-radius:6px;font-size:11px;text-align:center;padding:4px 2px;color:#62788a}
.fpw{overflow-x:auto;margin-top:4px;direction:ltr}.fp .rm.sm small:nth-of-type(2){display:none}.fp .rm small.tp{margin-top:auto;opacity:1}.fp .rm small.tp b{font-size:15px}.fp .rm small.tp i{font-style:normal}.fp .rm.sm small.tp i{display:none}.fp .rm small.tp+.pc2{margin-top:0}.fp .rm{overflow:hidden}.fp .rm small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brandbar{display:flex;justify-content:center;align-items:center;background:radial-gradient(ellipse at 50% 50%,#1d5383,#164570 70%);border:1px solid rgba(0,199,237,.25);border-radius:18px;overflow:hidden;padding:6px 12px}.bb{direction:ltr;display:flex;align-items:center;gap:22px;padding:6px 4px}.bbl{display:flex;flex-direction:column;align-items:stretch;gap:5px}.bbl img{display:block;height:46px;width:auto}.bbl span{font:600 9.5px/1 Inter,sans-serif;letter-spacing:2.6px;color:#c5d7e2;text-align:center}.bbs{display:block;width:1.5px;align-self:stretch;background:rgba(255,255,255,.55)}.bbt{font:800 17px/1.25 Inter,sans-serif;color:#fff;letter-spacing:.4px}.bbt em{font-style:normal;color:#00c7ed}@media(max-width:600px){.bbl img{height:34px}.bbt{font-size:13px}.bb{gap:14px}}
.note{font-size:12.5px;color:var(--mut);line-height:1.7;margin:4px 0}
@media(max-width:1000px){.app{grid-template-columns:minmax(0,1fr)}.side{position:static;padding:10px}.brand{margin-bottom:8px}.nav{display:flex;gap:4px;overflow-x:auto}.nav button{width:auto;flex:none}.row,.two{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.app{padding:10px;gap:12px}.card{padding:16px;border-radius:16px}.fig{min-height:240px}}
@media(prefers-reduced-motion:reduce){.kpi{transition:none}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand"><div class="logo">م</div><div><b>Mooneh Occupancy</b><small>نسب إشغال المستودعات</small></div></div>
  <nav class="nav" id="nav">
    <button type="button" data-t="sum">الملخص</button>
    <button type="button" data-t="m1">مونه 1 <span class="tag" id="tagm1"></span></button>
    <button type="button" data-t="m3">مونه 3 <span class="tag" id="tagm3"></span></button>
    <button type="button" data-t="m4">مونه 4 <span class="tag" id="tagm4"></span></button>
    <button type="button" data-t="m10">مونه 10 <span class="tag" id="tagm10"></span></button>
    <button type="button" data-t="ceva">CEVA <span class="tag" id="tagceva"></span></button>
  </nav>
  <button class="btn" type="button" data-up="auto" style="width:100%;margin-top:14px">رفع ملفات Excel</button>
  <p class="note uphint" style="margin:8px 6px 0">اختار الملفات الأربعة مرة وحدة، اللوحة بتعرف كل ملف لأي مستودع.</p>

/* ---------- xlsx reader (no library) ---------- */
async function readXlsx(buf){
  const u=new Uint8Array(buf),dv=new DataView(buf),td=new TextDecoder();

    files[td.decode(u.subarray(p+46,p+46+nl))]={m,cs,lo};p+=46+nl+xl+cl}

    if(fl.m===0)return td.decode(d);return await new Response(new Blob([d]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text()};

  if(sst)for(const si of xml(sst).getElementsByTagName('si')){let t='';for(const x of si.getElementsByTagName('t'))if(x.parentNode.nodeName!=='rPh')t+=x.textContent;ss.push(t)}
  const rel={};for(const r of xml(await get('xl/_rels/workbook.xml.rels')).getElementsByTagName('Relationship'))rel[r.getAttribute('Id')]=r.getAttribute('Target');
  const out={};
  for(const sh of xml(await get('xl/workbook.xml')).getElementsByTagName('sheet')){
    let tg=rel[sh.getAttribute('r:id')]||'';tg=tg.startsWith('/')?tg.slice(1):'xl/'+tg.replace(/^\.\//,'');
    const tx=await get(tg);if(!tx)continue;const rows=[];
    for(const c of xml(tx).getElementsByTagName('c')){const mt=/^([A-Z]+)(\d+)$/.exec(c.getAttribute('r')||'');if(!mt)continue;
      let col=0;for(const ch of mt[1])col=col*26+ch.charCodeAt(0)-64;col--;const row=+mt[2]-1;
      const t=c.getAttribute('t'),v=c.getElementsByTagName('v')[0];let val=null;
      if(t==='inlineStr')val=c.textContent;else if(v){const x=v.textContent;val=t==='s'?ss[+x]:t==='str'?x:t==='b'?x==='1':t==='e'?null:parseFloat(x)}
      if(val===null||val==='')continue;(rows[row]||(rows[row]=[]))[col]=val}
    out[sh.getAttribute('name')]=rows;
  }

}

  for(const s of dirSecs){const o=off(s);for(let k=0;k<ssz/128;k++){const e=o+k*128,nl=dv.getUint16(e+0x40,true);
    let name='';for(let i=0;i<Math.max(0,nl/2-1);i++)name+=String.fromCharCode(dv.getUint16(e+i*2,true));
    dirs.push({name,type:u[e+0x42],start:dv.getUint32(e+0x74,true),size:dv.getUint32(e+0x78,true)})}}

const ser=s=>{const d=new Date(Math.round((s-25569)*864e5));return [d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate()]};

/* ---------- Mooneh 3 extractor (raw log + opening balance) ---------- */

  if(logN&&names.some(n=>/Dashboard/i.test(n)))throw new Error('هذا ملف بالشكل القديم، ارفع التقرير الجديد');
  if(logN&&!opN)throw new Error('هذا ملف بالشكل القديم، ارفع التقرير الجديد (ما في شيت الرصيد الافتتاحي)');

  const cli=s=>String(s||'').trim();

    const q=r[cQ],t=String(r[cT]||'').trim();if(typeof q!=='number'||!cur||(t!=='تنزيل'&&t!=='تحميل'))continue;
    ops.push([cur,cli(r[cC]),cat(r[cK]),t==='تنزيل'?0:1,q,r[cR]?String(r[cR]).trim():'',r[cV]?String(r[cV]).trim():''])}

  const by=(fn)=>{const o={};cm.forEach(x=>{const k=fn(x);(o[k]||(o[k]=[0,0,0]))[x[3]]+=x[4];o[k][2]++});return Object.entries(o).map(([k,v])=>[k,...v]).sort((a,b)=>b[1]+b[2]-a[1]-a[2])};
  return {kind:'m3',open:iso(openS),last:iso(lastS),ym:[Y,Mo],cap80,cap100,share:.75,exM1,
    bal:[...bal.values()].map(b=>[b.c,b.k,b.open,b.in,b.out]),daily,lastOps,
    byVeh:by(x=>x[6]||'غير محدد'),byRep:by(x=>x[5]||'غير محدد'),
    months:Object.entries(months).map(([k,v])=>[+k,...v]).sort((a,b)=>a[0]-b[0]).slice(-6)};
}

/* ---------- Mooneh 1 + 4 extractor (rooms sheet) ---------- */

    if(avg){const yy=y(avg);s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${yy}" y2="${yy}" stroke="#b8863b" stroke-dasharray="4 4"/>`}

      if(i%every===0)s+=`<text x="${x(i)+gw/2}" y="${H-8}" fill="#9fb6c6" font-size="11" text-anchor="middle">${esc(labels[i])}</text>`});

      const show=e=>{const r=rows[i];tip.innerHTML=`<b>${esc(full(i))}</b><br>تنزيل ${f(r[0])} · تحميل ${f(r[1])} · صافي <bdi dir="ltr">${sg(r[0]-r[1])}</bdi>`;tip.style.opacity=1;

  };

async function loadSet(list){const nd={},ni={},bad=[];
  for(const f of list){try{const S0=await readAny(f.buf);let m=null,why='';
      for(const k of ['m3','m14','m10','ceva']){try{m=EXTRACT[k](S0);break}catch(x){if(!why&&/القديم|مونه 10:/.test(x.message))why=x.message}}
      if(!m)throw new Error(why||'ما عرفت لأي مستودع');
      for(const mm of (Array.isArray(m)?m:[m])){const sk=mm.kind,ik=sk.startsWith('m10')?'m10':sk.startsWith('ceva')?'ceva':sk;nd[sk]=mm;ni[ik]=`${f.name} · آخر تعديل ${fmtT(f.mod)}${f.by?' · '+f.by:''}`}
    }catch(e){bad.push(f.name+' ('+(e.message||e)+')')}}
  for(const x of Object.keys(D))delete D[x];Object.assign(D,nd);for(const x of Object.keys(INFO))delete INFO[x];Object.assign(INFO,ni);return bad}
function card(html){$('view').innerHTML=`<section class="card"><div class="soon">${html}</div></section>`}
function loginCard(msg){READY=false;card(`<b>Mooneh Occupancy</b>${msg?`<p class="st err" style="margin:10px 0">${esc(msg)}</p>`:''}<p class="sub" style="margin:10px 0 16px">سجّل دخول بحساب الشركة (Microsoft 365) لتشوف أرقام المستودعات</p><button class="btn" type="button" id="loginBtn" style="font-size:16px;padding:10px 22px">تسجيل الدخول بحساب الشركة</button>`);
  $('loginBtn').addEventListener('click',login)}
async function loadLive(quiet){if(!quiet)card('<b>عم بجيب آخر نسخة من الملفات…</b>');
  FILES=await listFiles();if(!FILES.length)throw new Error('مجلد Occupancy فاضي');
  await Promise.all(FILES.map(async f=>{f.buf=await getBuf(f.url||`/drives/${f.drive}/items/${f.id}/content`,!f.url)}));
  const bad=await loadSet(FILES);ARCH='';VERS=null;SPST=`آخر تحميل ${fmtT(new Date().toISOString())}`+(bad.length?' · مشاكل: '+bad.join('، '):'');
  READY=true;setArchUI();show(tab);if(bad.length)setSt(SPST,'err');loadVersions()}
async function loadVersions(){try{for(const f of FILES){let u=`/drives/${f.drive}/items/${f.id}/versions?$top=500`,all=[];
      for(let i=0;u&&i<6;i++){const j=await (await G(u)).json();all=all.concat(j.value||[]);u=j['@odata.nextLink']||''}
      f.vers=all.map(v=>({id:v.id,t:v.lastModifiedDateTime,by:(v.lastModifiedBy&&v.lastModifiedBy.user&&v.lastModifiedBy.user.displayName)||'',url:v['@microsoft.graph.downloadUrl']})).sort((a,b)=>a.t<b.t?-1:1)}
    VERS=[...new Set(FILES.flatMap(f=>(f.vers||[]).map(v=>dayOf(v.t))))].sort().reverse();setArchUI()}catch(e){VERS=[];setArchUI()}}
function setArchUI(){const s=$('archSel'),today=dayOf(new Date().toISOString()),ks=(VERS||[]).filter(k=>k!==today);
  s.innerHTML=`<option value="">الأحدث (الآن)</option>`+ks.map(k=>`<option value="${k}"${k===ARCH?' selected':''}>${ds(k)}</option>`).join('');
  $('arch').hidden=!READY||!ks.length;const b=$('archbar');b.hidden=!ARCH;
  if(ARCH)b.innerHTML=`📅 أنت تشوف أرشيف نهاية يوم <b>${ds(ARCH)}</b> (من نسخ الملفات المحفوظة على SharePoint)، الأرقام مش الحالية <button type="button" id="archBack">رجوع للأحدث</button>`}
async function openArch(k){if(!k){clearInterval(REFT);ARCH='';try{await loadLive()}catch(e){fail(e)}startAuto();return}
  ARCH=k;clearInterval(REFT);card(`<b>عم بجيب نسخ يوم ${ds(k)}…</b>`);
  try{const list=[];const miss=[];
    for(const f of FILES){const v=(f.vers||[]).filter(v=>dayOf(v.t)<=k).pop();if(!v){miss.push(f.name);continue}
      list.push({name:f.name,mod:v.t,by:v.by,buf:await getBuf(v.url||`/drives/${f.drive}/items/${f.id}/versions/${v.id}/content`,!v.url)})}
    const bad=await loadSet(list);SPST=`أرشيف ${ds(k)}`+(miss.length?' · ما في نسخة لـ: '+miss.join('، '):'')+(bad.length?' · مشاكل: '+bad.join('، '):'');
    READY=true;setArchUI();show(tab);if(miss.length||bad.length)setSt(SPST,'err')}catch(e){fail(e)}}
function fail(e){if(e&&e.login)return loginCard();READY=false;card(`<b>ما قدرت أجيب البيانات</b><p class="st err" style="margin:10px 0">${esc(e&&e.message||String(e))}</p><button class="btn" type="button" id="retryBtn">حاول مرة ثانية</button>`);$('retryBtn').addEventListener('click',()=>boot())}
function startAuto(){clearInterval(REFT);REFT=setInterval(()=>{if(!ARCH&&document.visibilityState==='visible')loadLive(true).catch(()=>{})},5*60*1000)}
$('archSel').addEventListener('change',e=>openArch(e.target.value));
document.addEventListener('click',e=>{if(e.target.id==='archBack')openArch('')});
async function boot(){const h0=(location.hash||'').slice(1);if(NAMES[h0])tab=h0;else tab='sum';show(tab);
  try{await handleRedirect()}catch(e){return loginCard('صار خطأ بتسجيل الدخول: '+(e.message||e))}
  if(!await token())return loginCard();
  try{await loadLive();startAuto()}catch(e){fail(e)}}
document.body.classList.add('ro');
boot();
}
</script>
